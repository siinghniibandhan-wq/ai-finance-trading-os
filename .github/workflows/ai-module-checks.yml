name: AI Module Tests and Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/services/ai_providers.py'
      - 'backend/app/routes/ai_assistant.py'
      - 'backend/tests/test_ai_providers.py'
      - 'frontend/**'
      - '.github/workflows/ai-module-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-provider-tests:
    name: AI provider unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run AI provider unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_ai_providers.py -q

  frontend-production-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
