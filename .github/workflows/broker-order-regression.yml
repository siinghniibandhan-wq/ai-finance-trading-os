name: Broker Order Regression Tests

on:
  push:
    branches:
      - main
      - "test/broker-order-regression-ci"
      - "test/broker-order-postgres-ci"
  pull_request:
    paths:
      - "backend/app/routes/broker_orders.py"
      - "backend/app/models.py"
      - "backend/app/database/**"
      - "backend/tests/test_broker_orders.py"
      - "backend/requirements.txt"
      - ".github/workflows/broker-order-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-order-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d broker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-test.db
      PYTHONPATH: .
      BROKER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/broker_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run SQLite broker-order regression tests
        run: python -m pytest -q tests/test_broker_orders.py
      - name: Run PostgreSQL persistence and reconciliation integration tests
        run: python -m pytest -q tests/test_broker_orders_postgres.py
