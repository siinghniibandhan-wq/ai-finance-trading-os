name: Broker order API regression tests

on:
  pull_request:
    paths:
      - "backend/app/routes/broker_orders.py"
      - "backend/app/routes/broker_reconciliation.py"
      - "backend/tests/test_broker_orders.py"
      - "backend/tests/test_broker_orders_postgres.py"
      - "backend/tests/test_broker_reconciliation.py"
      - "backend/migrations/20261018_add_broker_submission_investment_id.sql"
      - "backend/migrations/20261018_create_broker_reconciled_fills.sql"
      - ".github/workflows/broker-order-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/broker_orders.py"
      - "backend/app/routes/broker_reconciliation.py"
      - "backend/tests/test_broker_orders.py"
      - "backend/tests/test_broker_orders_postgres.py"
      - "backend/tests/test_broker_reconciliation.py"
      - "backend/migrations/20261018_add_broker_submission_investment_id.sql"
      - "backend/migrations/20261018_create_broker_reconciled_fills.sql"
      - ".github/workflows/broker-order-tests.yml"

permissions:
  contents: read

jobs:
  broker-orders:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Prepare disposable PostgreSQL schema and apply reconciliation migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
          BROKER_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine
          from app import models
          from app.database.database import Base
          engine = create_engine("postgresql+psycopg://test:test@localhost:5432/testdb")
          Base.metadata.create_all(engine)
          engine.dispose()
          PY
          psql "postgresql://test:test@localhost:5432/testdb" -v ON_ERROR_STOP=1 -f migrations/20261018_add_broker_submission_investment_id.sql
          psql "postgresql://test:test@localhost:5432/testdb" -v ON_ERROR_STOP=1 -f migrations/20261018_create_broker_reconciled_fills.sql
      - name: Run broker order and reconciliation tests with PostgreSQL migration coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
          BROKER_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
        run: pytest -q tests/test_broker_orders.py tests/test_broker_orders_postgres.py tests/test_broker_reconciliation.py
