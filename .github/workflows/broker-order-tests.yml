name: Broker order API regression tests

on:
  pull_request:
    paths:
      - "backend/app/routes/broker_orders.py"
      - "backend/tests/test_broker_orders.py"
      - ".github/workflows/broker-order-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/broker_orders.py"
      - "backend/tests/test_broker_orders.py"
      - ".github/workflows/broker-order-tests.yml"

permissions:
  contents: read

jobs:
  broker-orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run broker order API tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_broker_orders.py
