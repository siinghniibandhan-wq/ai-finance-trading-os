name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-aws-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend through AWS Systems Manager
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.AWS_BACKEND_APP_DIR }}
          SERVICE_NAME: ${{ vars.AWS_BACKEND_SERVICE_NAME }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$AWS_ROLE_ARN" ]] || missing+=("AWS_ROLE_ARN")
          [[ -n "$AWS_REGION" ]] || missing+=("AWS_REGION")
          [[ -n "$EC2_INSTANCE_ID" ]] || missing+=("EC2_INSTANCE_ID")
          [[ -n "$APP_DIR" ]] || missing+=("AWS_BACKEND_APP_DIR")
          [[ -n "$SERVICE_NAME" ]] || missing+=("AWS_BACKEND_SERVICE_NAME")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions environment variables: %s\n' "${missing[*]}"
            echo "Deployment stopped before connecting to AWS. Configure these variables in the GitHub production environment."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 using SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.AWS_BACKEND_APP_DIR }}
          SERVICE_NAME: ${{ vars.AWS_BACKEND_SERVICE_NAME }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy ${DEPLOY_SHA}" \
            --parameters "$(python - <<'PY'
          import json, os
          app_dir = os.environ["APP_DIR"]
          service = os.environ["SERVICE_NAME"]
          sha = os.environ["DEPLOY_SHA"]
          # Quote values so paths/service names cannot become shell syntax.
          import shlex
          commands = [
              "set -euo pipefail",
              f"cd {shlex.quote(app_dir)}",
              "git rev-parse --is-inside-work-tree",
              "git fetch origin main",
              "git checkout main",
              "git pull --ff-only origin main",
              f"sudo systemctl restart {shlex.quote(service)}",
              f"sudo systemctl is-active --quiet {shlex.quote(service)}",
              f"echo 'Deployed repository HEAD:'",
              "git rev-parse HEAD",
              f"echo 'Requested GitHub commit: {shlex.quote(sha)}'",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1
