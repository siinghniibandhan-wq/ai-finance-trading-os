name: Financial OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # The current high-severity advisory affects picomatch <= 4.0.7 in the
      # Vite/fdir development toolchain; the advisory publishes no fixed version.
      # Keep the full dev-tree report visible without masking production audit.
      - name: Report development-tool dependency advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - name: Test daily Important Notice schedule
        working-directory: frontend
        run: npm run test:notice
      - name: Test desktop sidebar collapse behavior
        working-directory: frontend
        run: npm run test:sidebar
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test Order Flow data model
        working-directory: frontend
        run: npm run test:market-flow

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q


  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
