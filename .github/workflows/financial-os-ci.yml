name: Financial OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Test daily Important Notice schedule
        working-directory: frontend
        run: npm run test:notice
      - name: Test desktop sidebar collapse behavior
        working-directory: frontend
        run: npm run test:sidebar
      - name: Test market overview partial-refresh handling
        working-directory: frontend
        run: npm run test:market
      - name: Test Advanced Chart candle normalization
        working-directory: frontend
        run: npm run test:advanced-chart
      - name: Test Chart Flow market and sector models
        working-directory: frontend
        run: npm run test:order-flow
      - name: Test Options Hub chain analytics
        working-directory: frontend
        run: npm run test:options-hub
      - name: Test Market corporate actions placement and Advanced Chart isolation
        working-directory: frontend
        run: npm run test:corporate-actions
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test picomatch ReDoS regression guard
        working-directory: frontend
        run: npm run test:security
      # Audit the complete dependency tree. The picomatch override points to
      # our source-patched local fork; do not narrow or skip dev dependencies.
      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q


  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
