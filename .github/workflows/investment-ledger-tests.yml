name: Investment transaction ledger regression tests

on:
  pull_request:
    paths:
      - "backend/app/routes/investment_transactions.py"
      - "backend/tests/test_investment_transaction_timeline.py"
      - "backend/tests/test_investment_transaction_timeline_regressions.py"
      - "backend/tests/test_investment_transaction_edit_void_regressions.py"
      - ".github/workflows/investment-ledger-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/investment_transactions.py"
      - "backend/tests/test_investment_transaction_timeline.py"
      - "backend/tests/test_investment_transaction_timeline_regressions.py"
      - "backend/tests/test_investment_transaction_edit_void_regressions.py"
      - ".github/workflows/investment-ledger-tests.yml"

permissions:
  contents: read

jobs:
  investment-ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run investment ledger regression tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
        run: |
          pytest -q \
            tests/test_investment_transaction_timeline.py \
            tests/test_investment_transaction_timeline_regressions.py \
            tests/test_investment_transaction_edit_void_regressions.py
