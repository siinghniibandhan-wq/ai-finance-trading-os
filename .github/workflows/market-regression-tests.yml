name: Market search and quote regression tests

on:
  pull_request:
    paths:
      - "backend/app/routes/market.py"
      - "backend/app/routes/broker_orders.py"
      - "backend/app/routes/broker_reconciliation.py"
      - "backend/tests/test_broker_reconciliation.py"
      - "backend/tests/test_broker_orders.py"
      - "backend/app/routes/market_search.py"
      - "backend/app/routes/market_quote.py"
      - "backend/app/services/market_price.py"
      - "backend/app/routes/investments.py"
      - "backend/tests/test_investment_portfolio_valuation.py"
      - "backend/tests/test_market_search_all_exchanges.py"
      - "backend/tests/test_market_price_shared_cache.py"
      - "backend/tests/test_market_price_symbol_matching.py"
      - "backend/tests/test_market_quote_route.py"
      - ".github/workflows/market-regression-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/market.py"
      - "backend/app/routes/broker_orders.py"
      - "backend/tests/test_broker_orders.py"
      - "backend/app/routes/broker_reconciliation.py"
      - "backend/tests/test_broker_reconciliation.py"
      - "backend/app/routes/market_search.py"
      - "backend/app/routes/market_quote.py"
      - "backend/app/services/market_price.py"
      - "backend/tests/test_market_search_all_exchanges.py"
      - "backend/tests/test_market_price_shared_cache.py"
      - "backend/tests/test_market_price_symbol_matching.py"
      - "backend/tests/test_market_quote_route.py"
      - ".github/workflows/market-regression-tests.yml"

permissions:
  contents: read

jobs:
  market-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run market search and quote regression tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
        run: |
          pytest -q \
            tests/test_market_search_all_exchanges.py \
            tests/test_market_price_shared_cache.py \
            tests/test_market_price_symbol_matching.py \
            tests/test_market_quote_route.py \
            tests/test_broker_orders.py \
            tests/test_broker_reconciliation.py \
            tests/test_investment_portfolio_valuation.py
