name: Package AWS-restored source archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-aws-restored-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source archive
        run: |
          zip -r /tmp/financial-os-aws-restored.zip . \
            -x ".git/*" \
               "*/node_modules/*" \
               "*/.venv/*" \
               "*/__pycache__/*" \
               "*/.pytest_cache/*" \
               "*/dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: financial-os-aws-restored-source
          path: /tmp/financial-os-aws-restored.zip
          if-no-files-found: error
          retention-days: 30
