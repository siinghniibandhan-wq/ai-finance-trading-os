name: Portfolio Money Flow Checks

on:
  push:
    branches:
      - fix/portfolio-broker-cash-linkage
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/portfolio-money-flow-checks.yml"

permissions:
  contents: read

jobs:
  backend-cash-accounting-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run cash-accounting unit tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          PYTHONPATH: .
        run: pytest -q tests/test_investment_cash_accounting.py tests/test_investment_transaction_timeline.py tests/test_investment_portfolio_valuation.py tests/test_broker_reconciliation.py tests/test_money_transfer_and_finance_diary.py tests/test_capital_gains_date_classification.py tests/test_final_tax_liability_capital_gains_review.py tests/test_tax_capital_gains_safety.py tests/test_tax_income_safety.py tests/test_tax_calculation_eligibility_safeguards.py

  frontend-production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
