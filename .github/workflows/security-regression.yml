name: Security and regression checks

on:
  push:
    branches: [main, security-hardening-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend security and financial-integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_SECRET_KEY: local-test-secret-change-me-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pip-audit
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run backend regression suite
        run: pytest -q tests/
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  frontend-build:
    name: Frontend production build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run static UI regression audit
        run: node scripts/theme-audit.mjs
      - name: Build frontend
        run: npm run build
