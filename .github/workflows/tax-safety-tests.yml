name: Backend financial integrity tests

on:
  pull_request:
    paths:
      - "backend/app/routes/tax_calculation.py"
      - "backend/tests/test_tax_review_rules.py"
      - "backend/app/routes/itr_ready_tax_report.py"
      - "backend/app/tax_review_rules.py"
      - "backend/app/routes/tax_review.py"
      - "backend/app/main.py"
      - "backend/app/models.py"
      - "backend/app/routes/investment_transactions.py"
      - "backend/app/routes/investment_pnl.py"
      - "backend/tests/test_tax_calculation_eligibility_safeguards.py"
      - "backend/tests/test_tax_calculation_review_flags.py"
      - "backend/tests/test_investment_transaction_timeline.py"
      - "backend/tests/test_investment_pnl_calculation.py"
      - "backend/tests/test_investment_portfolio_valuation.py"
      - ".github/workflows/tax-safety-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/tax_calculation.py"
      - "backend/app/models.py"
      - "backend/app/main.py"
      - "backend/app/routes/tax_review.py"
      - "backend/app/tax_review_rules.py"
      - "backend/app/routes/itr_ready_tax_report.py"
      - "backend/tests/test_tax_review_rules.py"
      - "backend/app/routes/investment_transactions.py"
      - "backend/app/routes/investment_pnl.py"
      - "backend/tests/test_tax_calculation_eligibility_safeguards.py"
      - "backend/tests/test_tax_calculation_review_flags.py"
      - "backend/tests/test_investment_transaction_timeline.py"
      - "backend/tests/test_investment_pnl_calculation.py"
      - "backend/tests/test_investment_portfolio_valuation.py"
      - ".github/workflows/tax-safety-tests.yml"

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run financial integrity regression tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
        run: |
          pytest -q \
            tests/test_tax_review_rules.py \
            tests/test_tax_calculation_eligibility_safeguards.py \
            tests/test_tax_calculation_review_flags.py \
            tests/test_investment_transaction_timeline.py \
            tests/test_investment_pnl_calculation.py \
            tests/test_investment_portfolio_valuation.py
