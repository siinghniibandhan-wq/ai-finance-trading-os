name: Tax calculation safety tests

on:
  pull_request:
    paths:
      - "backend/app/routes/tax_calculation.py"
      - "backend/tests/test_tax_calculation_eligibility_safeguards.py"
      - "backend/tests/test_tax_calculation_review_flags.py"
      - ".github/workflows/tax-safety-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routes/tax_calculation.py"
      - "backend/tests/test_tax_calculation_eligibility_safeguards.py"
      - "backend/tests/test_tax_calculation_review_flags.py"
      - ".github/workflows/tax-safety-tests.yml"

permissions:
  contents: read

jobs:
  tax-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run capital-gains tax safety tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_tax_calculation_eligibility_safeguards.py tests/test_tax_calculation_review_flags.py
