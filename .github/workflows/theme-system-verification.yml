name: Theme System Verification

on:
  push:
    branches:
      - refactor/theme-design-system
  pull_request:
    branches:
      - main

jobs:
  frontend-theme-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run theme architecture and contrast audit
        run: node scripts/theme-audit.mjs
      - name: Build frontend
        run: npm run build
