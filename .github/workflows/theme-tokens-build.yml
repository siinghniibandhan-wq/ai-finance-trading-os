name: Theme Tokens Frontend Build

on:
  push:
    branches:
      - theme-tokens
    paths:
      - "frontend/**"
      - ".github/workflows/theme-tokens-build.yml"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme-tokens branch
        uses: actions/checkout@v4
        with:
          ref: theme-tokens
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
